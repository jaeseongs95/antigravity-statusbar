name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'fix/**'
      - 'bugfix/**'
      - 'release/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout antigravity-statusbar
        uses: actions/checkout@v4
        with:
          path: antigravity-statusbar

      - name: Checkout sibling antigravity-mcp-manager
        uses: actions/checkout@v4
        with:
          repository: jaeseongs95/antigravity-mcp-manager
          ref: ${{ github.ref == 'refs/heads/main' && 'main' || 'develop' }}
          path: antigravity-mcp-manager

      - name: Checkout sibling antigravity-ko-translator
        uses: actions/checkout@v4
        with:
          repository: jaeseongs95/antigravity-ko-translator
          ref: ${{ github.ref == 'refs/heads/main' && 'main' || 'develop' }}
          path: ko-thought-translator

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run unit tests
        working-directory: antigravity-statusbar
        run: npm test
